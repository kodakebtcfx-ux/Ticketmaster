<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Ticket Master Demo — Harry Styles</title>

<style>
:root{
  --blue:#087cff;
  --blue-dark:#0054c7;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#101828;
  --muted:#667085;
  --border:#e4e7ec;
  --danger:#f04438;
  --success:#12b76a;
  --shadow:0 8px 28px rgba(16,24,40,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:900px;
  min-height:100vh;
  margin:auto;
  background:var(--bg);
  padding-bottom:90px;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.header-inner{
  height:62px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:800;
  letter-spacing:-.5px;
}

.logo span{
  color:var(--blue);
}

.demo-badge{
  font-size:11px;
  font-weight:700;
  padding:6px 9px;
  border-radius:999px;
  background:#fff4e5;
  color:#b54708;
}

/* PAGE */

.page{
  padding:18px;
}

.back{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:14px;
  font-weight:600;
  margin-bottom:16px;
  background:none;
}

/* EVENT HERO */

.event-hero{
  height:240px;
  border-radius:22px;
  overflow:hidden;
  position:relative;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.05),
      rgba(0,0,0,.75)
    ),
    linear-gradient(
      135deg,
      #30243b,
      #8d5275,
      #171717
    );
}

.event-hero-content{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:22px;
  color:white;
}

.event-label{
  display:inline-block;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.8px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(8px);
  padding:7px 10px;
  border-radius:999px;
  margin-bottom:9px;
}

.event-title{
  margin:0;
  font-size:27px;
  letter-spacing:-.8px;
}

.event-subtitle{
  margin:6px 0 0;
  opacity:.9;
  font-size:14px;
}

/* CARDS */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  margin-top:16px;
  box-shadow:var(--shadow);
}

.info-card{
  padding:18px;
}

.info-row{
  display:flex;
  gap:14px;
  padding:13px 0;
  border-bottom:1px solid var(--border);
}

.info-row:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.info-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  background:#eef5ff;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--blue);
  font-size:18px;
}

.info-label{
  font-size:12px;
  color:var(--muted);
}

.info-value{
  margin-top:3px;
  font-size:15px;
  font-weight:700;
}

/* BUTTONS */

.primary{
  width:100%;
  padding:15px;
  border-radius:13px;
  background:var(--blue);
  color:white;
  font-weight:800;
  margin-top:16px;
}

.primary:active{
  transform:scale(.99);
}

.secondary{
  width:100%;
  padding:14px;
  border-radius:13px;
  background:#eef5ff;
  color:var(--blue-dark);
  font-weight:800;
  margin-top:10px;
}

/* TICKET */

.ticket{
  overflow:hidden;
}

.ticket-top{
  padding:20px;
  background:
    linear-gradient(
      135deg,
      #171717,
      #453148,
      #151515
    );
  color:white;
}

.ticket-demo{
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  color:#ffd166;
  text-transform:uppercase;
}

.ticket-event{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.ticket-bottom{
  padding:20px;
}

.ticket-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.ticket-field label{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-bottom:4px;
}

.ticket-field strong{
  font-size:15px;
}

.barcode{
  height:76px;
  margin-top:22px;
  border-radius:9px;
  background:
    repeating-linear-gradient(
      90deg,
      #111 0px,
      #111 2px,
      transparent 2px,
      transparent 5px,
      #111 5px,
      #111 6px,
      transparent 6px,
      transparent 10px
    );
}

.barcode-caption{
  text-align:center;
  color:var(--muted);
  font-size:10px;
  margin-top:7px;
}

/* TRANSFER */

.transfer-card{
  padding:20px;
}

.transfer-card h2{
  margin:0;
  font-size:21px;
}

.transfer-card p{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

.field{
  margin-top:16px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input{
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  background:white;
}

.field input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(8,124,255,.1);
}

.message{
  min-height:100px;
  resize:vertical;
}

/* SUCCESS */

.success{
  text-align:center;
  padding:35px 20px;
}

.success-icon{
  width:64px;
  height:64px;
  margin:auto;
  border-radius:50%;
  background:#e8f8f1;
  color:var(--success);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:900;
}

.success h2{
  margin:18px 0 7px;
}

.success p{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

/* NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:900px;
  height:72px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:30;
}

.nav-item{
  background:none;
  color:#667085;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:10px;
  font-weight:700;
}

.nav-item.active{
  color:var(--blue);
}

.nav-icon{
  font-size:20px;
}

/* TOAST */

.toast{
  position:fixed;
  left:18px;
  right:18px;
  bottom:90px;
  background:#101828;
  color:white;
  padding:14px 16px;
  border-radius:13px;
  font-size:13px;
  font-weight:600;
  transform:translateY(140px);
  opacity:0;
  transition:.25s;
  z-index:100;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

@media(max-width:500px){
  .event-hero{
    height:220px;
  }

  .event-title{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="header-inner">

      <div class="logo">
        Ticket <span>Master</span>
      </div>

      <div class="demo-badge">
        DEMO APP
      </div>

    </div>
  </header>


  <main id="mainContent"></main>


  <nav class="bottom-nav">

    <button class="nav-item active"
            onclick="showEvent()">
      <div class="nav-icon">⌂</div>
      Event
    </button>

    <button class="nav-item"
            onclick="showTicket()">
      <div class="nav-icon">🎟</div>
      My Ticket
    </button>

    <button class="nav-item"
            onclick="showTransfer()">
      <div class="nav-icon">↗</div>
      Transfer
    </button>

  </nav>

</div>

<div id="toast" class="toast"></div>


<script>

/* ------------------------------------------------
   DEMO EVENT DATA
------------------------------------------------ */

const eventData = {

  artist:
    "Harry Styles",

  event:
    "Harry Styles: Together, Together",

  date:
    "May 29, 2027",

  time:
    "8:00 PM",

  venue:
    "Soldier Field",

  city:
    "Chicago, IL",

  section:
    "Section 143",

  row:
    "Row A",

  seats:
    "Seats 3, 4 & 5",

  price:
    "$165.00",

  ticketCode:
    "DEMO-HS-2027-143-A"

};


/* ------------------------------------------------
   MAIN EVENT PAGE
------------------------------------------------ */

function showEvent(){

  document.getElementById("mainContent").innerHTML = `

    <div class="page">

      <div class="event-hero">

        <div class="event-hero-content">

          <div class="event-label">
            Demo Event
          </div>

          <h1 class="event-title">
            ${eventData.event}
          </h1>

          <p class="event-subtitle">
            ${eventData.artist}
          </p>

        </div>

      </div>


      <div class="card info-card">

        <div class="info-row">

          <div class="info-icon">📅</div>

          <div>
            <div class="info-label">
              Date
            </div>

            <div class="info-value">
              ${eventData.date}
            </div>
          </div>

        </div>


        <div class="info-row">

          <div class="info-icon">🕗</div>

          <div>
            <div class="info-label">
              Time
            </div>

            <div class="info-value">
              ${eventData.time}
            </div>
          </div>

        </div>


        <div class="info-row">

          <div class="info-icon">📍</div>

          <div>
            <div class="info-label">
              Venue
            </div>

            <div class="info-value">
              ${eventData.venue}
            </div>

            <div class="info-label">
              ${eventData.city}
            </div>
          </div>

        </div>

      </div>


      <button class="primary"
              onclick="showTicket()">

        View My Ticket

      </button>

    </div>

  `;
}


/* ------------------------------------------------
   MY TICKET
------------------------------------------------ */

function showTicket(){

  document.getElementById("mainContent").innerHTML = `

    <div class="page">

      <button class="back"
              onclick="showEvent()">

        ← Back to Event

      </button>


      <div class="card ticket">

        <div class="ticket-top">

          <div class="ticket-demo">
            Independent Demo Ticket
          </div>

          <div class="ticket-event">
            ${eventData.event}
          </div>

        </div>


        <div class="ticket-bottom">

          <div class="ticket-grid">

            <div class="ticket-field">
              <label>
                DATE
              </label>
              <strong>
                ${eventData.date}
              </strong>
            </div>


            <div class="ticket-field">
              <label>
                TIME
              </label>
              <strong>
                ${eventData.time}
              </strong>
            </div>


            <div class="ticket-field">
              <label>
                VENUE
              </label>
              <strong>
                ${eventData.venue}
              </strong>
            </div>


            <div class="ticket-field">
              <label>
                LOCATION
              </label>
              <strong>
                ${eventData.city}
              </strong>
            </div>


            <div class="ticket-field">
              <label>
                SECTION
              </label>
              <strong>
                ${eventData.section}
              </strong>
            </div>


            <div class="ticket-field">
              <label>
                ROW
              </label>
              <strong>
                ${eventData.row}
              </strong>
            </div>


            <div class="ticket-field">
              <label>
                SEATS
              </label>
              <strong>
                ${eventData.seats}
              </strong>
            </div>


            <div class="ticket-field">
              <label>
                PRICE
              </label>
              <strong>
                ${eventData.price}
              </strong>
            </div>

          </div>


          <div class="barcode"></div>

          <div class="barcode-caption">
            DEMO CODE — NOT VALID FOR VENUE ENTRY
          </div>


          <button class="primary"
                  onclick="showTransfer()">

            Transfer Ticket

          </button>

        </div>

      </div>

    </div>

  `;
}


/* ------------------------------------------------
   TRANSFER PAGE
------------------------------------------------ */

function showTransfer(){

  document.getElementById("mainContent").innerHTML = `

    <div class="page">

      <button class="back"
              onclick="showTicket()">

        ← Back to My Ticket

      </button>


      <div class="card transfer-card">

        <h2>
          Transfer Ticket
        </h2>

        <p>
          Send this demo ticket to another person
          using their email address.
        </p>


        <div class="field">

          <label>
            Recipient email
          </label>

          <input
            id="recipientEmail"
            type="email"
            placeholder="name@example.com"
          >

        </div>


        <div class="field">

          <label>
            Message
          </label>

          <textarea
            id="transferMessage"
            class="message"
            placeholder="Add an optional message..."
          ></textarea>

        </div>


        <button class="primary"
                onclick="sendTransfer()">

          Continue Transfer

        </button>


        <button class="secondary"
                onclick="showTicket()">

          Cancel

        </button>

      </div>

    </div>

  `;
}


/* ------------------------------------------------
   TRANSFER SIMULATION
------------------------------------------------ */

function sendTransfer(){

  const email =
    document.getElementById(
      "recipientEmail"
    ).value.trim();


  if(!email){

    showToast(
      "Please enter a recipient email."
    );

    return;
  }


  if(!email.includes("@")){

    showToast(
      "Please enter a valid email address."
    );

    return;
  }


  const message =
    document.getElementById(
      "transferMessage"
    ).value.trim();


  document.getElementById(
    "mainContent"
  ).innerHTML = `

    <div class="page">

      <div class="card success">

        <div class="success-icon">
          ✓
        </div>


        <h2>
          Transfer Created
        </h2>


        <p>

          This is a simulated transfer for the
          independent demo application.

        </p>


        <p>

          Recipient:
          <strong>${escapeHtml(email)}</strong>

        </p>


        ${
          message
          ?
          `
          <p>
            Message:
            "${escapeHtml(message)}"
          </p>
          `
          :
          ""
        }


        <button class="primary"
                onclick="showTicket()">

          Back to My Ticket

        </button>

      </div>

    </div>

  `;

}


/* ------------------------------------------------
   SECURITY / TEXT ESCAPING
------------------------------------------------ */

function escapeHtml(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ------------------------------------------------
   TOAST
------------------------------------------------ */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    message;

  toast.classList.add("show");

  setTimeout(() => {

    toast.classList.remove("show");

  }, 2500);

}


/* ------------------------------------------------
   START APP
------------------------------------------------ */

showEvent();

</script>

</body>
</html>
