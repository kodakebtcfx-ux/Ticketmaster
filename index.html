<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Ticket Master — Independent Event Tickets</title>

<link rel="apple-touch-icon"
      sizes="180x180"
      href="7953ADA7-1E8B-445A-BDF1-6A531ADE37A0.png">

<link rel="icon"
      type="image/png"
      href="7953ADA7-1E8B-445A-BDF1-6A531ADE37A0.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b5cff">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

body{
  min-height:100vh;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top right,#dce9ff 0,#f5f7fb 45%,#eef3ff 100%);
}

.auth-box{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:24px;
  padding:28px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.12);
}

.auth-logo{
  width:58px;
  height:58px;
  border-radius:16px;
  object-fit:cover;
  display:block;
  margin:0 auto 14px;
}

.auth-title{
  text-align:center;
  font-size:27px;
  font-weight:800;
  margin-bottom:5px;
}

.auth-subtitle{
  text-align:center;
  color:#6b7280;
  font-size:14px;
  margin-bottom:24px;
}

.auth-tabs{
  display:flex;
  background:#f1f4f8;
  padding:4px;
  border-radius:12px;
  margin-bottom:20px;
}

.auth-tab{
  flex:1;
  border:0;
  padding:11px;
  border-radius:9px;
  background:transparent;
  font-weight:700;
  color:#6b7280;
}

.auth-tab.active{
  background:#fff;
  color:#0b5cff;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.form-group{
  margin-bottom:14px;
}

.form-label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
  color:#374151;
}

.form-input{
  width:100%;
  border:1px solid #d8dee8;
  background:#fff;
  border-radius:12px;
  padding:13px 14px;
  outline:none;
  transition:.2s;
}

.form-input:focus{
  border-color:#0b5cff;
  box-shadow:0 0 0 3px rgba(11,92,255,.1);
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  background:#0b5cff;
  color:#fff;
  font-weight:800;
  margin-top:5px;
}

.primary-btn:disabled{
  opacity:.6;
}

.auth-note{
  text-align:center;
  color:#7b8493;
  font-size:12px;
  line-height:1.5;
  margin-top:16px;
}

/* APP */

#app{
  min-height:100vh;
  padding-bottom:76px;
}

.top-header{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid #e8ecf2;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:13px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.brand img{
  width:37px;
  height:37px;
  border-radius:10px;
  object-fit:cover;
}

.brand-name{
  font-size:18px;
  font-weight:900;
  white-space:nowrap;
}

.header-spacer{
  flex:1;
}

.header-user{
  border:0;
  background:#eef3ff;
  color:#0b5cff;
  width:38px;
  height:38px;
  border-radius:50%;
  font-weight:800;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:20px 16px;
}

/* SEARCH */

.search-box{
  position:relative;
  margin-bottom:18px;
}

.search-box input{
  width:100%;
  padding:14px 16px 14px 45px;
  border:1px solid #e0e5ed;
  border-radius:15px;
  background:#fff;
  outline:none;
}

.search-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:#8a94a5;
}

/* HERO */

.hero{
  background:linear-gradient(135deg,#0b5cff,#1643c7);
  color:#fff;
  border-radius:22px;
  padding:24px 20px;
  margin-bottom:22px;
  box-shadow:0 12px 30px rgba(11,92,255,.22);
}

.hero h1{
  margin:0 0 8px;
  font-size:28px;
  line-height:1.12;
}

.hero p{
  margin:0;
  color:rgba(255,255,255,.86);
  line-height:1.5;
  font-size:14px;
}

/* SECTION */

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:20px 0 12px;
}

.section-title{
  font-size:20px;
  font-weight:850;
}

.section-action{
  border:0;
  background:none;
  color:#0b5cff;
  font-weight:750;
}

/* FILTERS */

.filter-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
  margin-bottom:15px;
}

.filter-row::-webkit-scrollbar{
  display:none;
}

.filter-btn{
  white-space:nowrap;
  border:1px solid #dce2ea;
  background:#fff;
  border-radius:999px;
  padding:9px 14px;
  font-size:13px;
  font-weight:700;
}

.filter-btn.active{
  background:#0b5cff;
  color:#fff;
  border-color:#0b5cff;
}

/* EVENTS */

.events-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.event-card{
  background:#fff;
  border-radius:17px;
  overflow:hidden;
  border:1px solid #e9edf3;
  box-shadow:0 5px 18px rgba(16,24,40,.05);
  cursor:pointer;
}

.event-image{
  width:100%;
  aspect-ratio:1.35;
  object-fit:cover;
  background:#e7ebf1;
}

.event-body{
  padding:12px;
}

.event-title{
  font-size:15px;
  font-weight:850;
  line-height:1.2;
  margin-bottom:6px;
}

.event-date{
  color:#5d6878;
  font-size:12px;
  line-height:1.4;
}

.event-venue{
  color:#7a8494;
  font-size:11px;
  margin-top:4px;
  line-height:1.35;
}

.event-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:10px;
}

.event-price{
  font-weight:850;
  font-size:13px;
}

.favorite-btn{
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:#f0f3f8;
  color:#7b8491;
  font-size:16px;
}

.favorite-btn.active{
  color:#ef3340;
  background:#fff0f1;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:45px 20px;
  color:#788293;
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px;
}

.empty h3{
  margin:0 0 6px;
  color:#1f2937;
}

/* DETAIL */

.back-btn{
  border:0;
  background:#fff;
  width:40px;
  height:40px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.07);
  margin-bottom:15px;
}

.detail-hero{
  border-radius:20px;
  overflow:hidden;
  background:#fff;
  border:1px solid #e6eaf0;
}

.detail-image{
  width:100%;
  max-height:310px;
  object-fit:cover;
}

.detail-body{
  padding:18px;
}

.detail-title-row{
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.detail-title{
  flex:1;
  font-size:25px;
  font-weight:900;
  line-height:1.12;
}

.detail-fav{
  flex:none;
  width:43px;
  height:43px;
  border-radius:50%;
  border:0;
  background:#f1f4f8;
  font-size:20px;
}

.detail-info{
  display:grid;
  gap:9px;
  margin-top:16px;
}

.info-item{
  display:flex;
  gap:10px;
  align-items:flex-start;
  color:#4b5563;
  font-size:14px;
}

.info-item span:first-child{
  width:23px;
}

.detail-description{
  margin-top:18px;
  color:#667085;
  line-height:1.55;
  font-size:14px;
}

/* SEATS */

.seat-wrap{
  margin-top:20px;
  padding-bottom:100px;
}

.stage{
  text-align:center;
  background:#1d2738;
  color:#fff;
  border-radius:10px 10px 50% 50%;
  padding:12px;
  margin:0 auto 25px;
  max-width:290px;
  font-size:12px;
  font-weight:800;
  letter-spacing:1px;
}

.seat-section{
  margin-bottom:24px;
}

.seat-section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.seat-section-title strong{
  font-size:14px;
}

.seat-section-title span{
  font-size:12px;
  color:#788293;
}

.seat-row{
  display:flex;
  gap:5px;
  justify-content:center;
  margin-bottom:6px;
  overflow-x:auto;
  padding:2px;
}

.seat{
  width:25px;
  height:25px;
  min-width:25px;
  border-radius:7px 7px 5px 5px;
  border:0;
  font-size:8px;
  font-weight:800;
  background:#dce5f4;
  color:#354052;
}

.seat.available:hover{
  transform:translateY(-1px);
}

.seat.selected{
  background:#0b5cff;
  color:#fff;
}

.seat.sold{
  background:#aab2be;
  color:#fff;
  cursor:not-allowed;
}

.seat.resale{
  background:#ffb020;
  color:#fff;
}

.seat-legend{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:15px;
  margin-top:20px;
  color:#6b7280;
  font-size:11px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
}

.legend-dot{
  width:13px;
  height:13px;
  border-radius:4px;
}

.dot-available{background:#dce5f4}
.dot-selected{background:#0b5cff}
.dot-sold{background:#aab2be}
.dot-resale{background:#ffb020}

/* BUY BAR */

.buy-bar{
  position:fixed;
  z-index:80;
  left:0;
  right:0;
  bottom:65px;
  background:#fff;
  border-top:1px solid #e1e6ee;
  box-shadow:0 -8px 25px rgba(0,0,0,.08);
  transform:translateY(120%);
  transition:.25s;
}

.buy-bar.show{
  transform:translateY(0);
}

.buy-bar-inner{
  max-width:1100px;
  margin:auto;
  padding:11px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}

.buy-summary{
  flex:1;
}

.buy-summary strong{
  display:block;
  font-size:14px;
}

.buy-summary span{
  color:#727d8d;
  font-size:12px;
}

.buy-btn{
  border:0;
  background:#0b5cff;
  color:#fff;
  border-radius:12px;
  padding:13px 19px;
  font-weight:850;
}

/* PAGES */

.page-title{
  font-size:25px;
  font-weight:900;
  margin:5px 0 18px;
}

/* TICKETS */

.ticket-card{
  background:#fff;
  border:1px solid #e3e8ef;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:14px;
  box-shadow:0 5px 18px rgba(16,24,40,.05);
}

.ticket-top{
  display:flex;
  gap:12px;
  padding:14px;
}

.ticket-image{
  width:74px;
  height:74px;
  object-fit:cover;
  border-radius:12px;
}

.ticket-info{
  flex:1;
  min-width:0;
}

.ticket-info h3{
  margin:0 0 5px;
  font-size:16px;
}

.ticket-info p{
  margin:3px 0;
  color:#6b7280;
  font-size:12px;
}

.ticket-status{
  display:inline-block;
  margin-top:6px;
  padding:4px 7px;
  border-radius:999px;
  background:#e8f8ef;
  color:#16834b;
  font-size:10px;
  font-weight:800;
}

.ticket-details{
  border-top:1px dashed #d8dee8;
  padding:13px 14px;
}

.ticket-seat{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:13px;
}

.ticket-seat div{
  background:#f6f8fb;
  border-radius:10px;
  padding:9px;
}

.ticket-seat small{
  display:block;
  color:#7b8492;
  font-size:10px;
}

.ticket-seat strong{
  font-size:13px;
}

.ticket-actions{
  display:flex;
  gap:8px;
}

.small-btn{
  flex:1;
  border:1px solid #dce2ea;
  background:#fff;
  border-radius:10px;
  padding:10px;
  font-size:12px;
  font-weight:750;
}

.small-btn.primary{
  background:#0b5cff;
  border-color:#0b5cff;
  color:#fff;
}

/* ORDERS */

.order-card{
  background:#fff;
  border:1px solid #e4e9f0;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
}

.order-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.order-head h3{
  margin:0;
  font-size:15px;
}

.order-status{
  color:#16834b;
  font-size:11px;
  font-weight:800;
}

.order-meta{
  color:#737e8e;
  font-size:12px;
  margin-top:7px;
  line-height:1.5;
}

.order-total{
  margin-top:10px;
  font-weight:900;
}

/* PROFILE */

.profile-card{
  background:#fff;
  border:1px solid #e4e9f0;
  border-radius:18px;
  padding:20px;
}

.profile-avatar{
  width:72px;
  height:72px;
  border-radius:50%;
  background:#0b5cff;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  font-weight:900;
  margin-bottom:12px;
}

.profile-name{
  font-size:22px;
  font-weight:900;
}

.profile-email{
  color:#778191;
  font-size:13px;
  margin-top:3px;
}

.profile-actions{
  margin-top:20px;
  display:grid;
  gap:9px;
}

.profile-action{
  width:100%;
  text-align:left;
  border:1px solid #e1e6ed;
  background:#fff;
  padding:13px;
  border-radius:12px;
  font-weight:750;
}

.profile-action.danger{
  color:#dc2626;
}

/* TRANSFERS / MARKETPLACE */

.transfer-card,
.market-card{
  background:#fff;
  border:1px solid #e2e7ee;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
}

.transfer-card h3,
.market-card h3{
  margin:0 0 7px;
  font-size:15px;
}

.transfer-meta,
.market-meta{
  color:#737e8e;
  font-size:12px;
  line-height:1.5;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(8,15,28,.56);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:550px;
  max-height:92vh;
  overflow-y:auto;
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:20px;
  animation:slideUp .2s ease;
}

@keyframes slideUp{
  from{transform:translateY(40px);opacity:.5}
  to{transform:translateY(0);opacity:1}
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

.modal-title{
  font-size:20px;
  font-weight:900;
}

.close-btn{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#f0f3f7;
  font-size:20px;
}

.checkout-event{
  background:#f5f7fb;
  border-radius:13px;
  padding:12px;
  margin-bottom:15px;
}

.checkout-event strong{
  display:block;
  font-size:14px;
}

.checkout-event span{
  display:block;
  color:#727d8c;
  font-size:12px;
  margin-top:3px;
}

.checkout-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.full-btn{
  width:100%;
  border:0;
  background:#0b5cff;
  color:#fff;
  border-radius:12px;
  padding:14px;
  font-weight:850;
  margin-top:12px;
}

.security-note{
  margin-top:11px;
  padding:10px;
  border-radius:10px;
  background:#fff8e8;
  color:#8a6415;
  font-size:11px;
  line-height:1.45;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:500;
  left:50%;
  bottom:90px;
  transform:translate(-50%,20px);
  background:#111827;
  color:#fff;
  padding:11px 15px;
  border-radius:11px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* NAV */

.bottom-nav{
  position:fixed;
  z-index:100;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
  border-top:1px solid #e4e8ee;
  display:flex;
  justify-content:center;
}

.bottom-nav-inner{
  width:100%;
  max-width:700px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-btn{
  border:0;
  background:#fff;
  color:#7b8492;
  padding:9px 3px 8px;
  font-size:10px;
  font-weight:750;
}

.nav-icon{
  display:block;
  font-size:19px;
  line-height:20px;
  margin-bottom:3px;
}

.nav-btn.active{
  color:#0b5cff;
}

/* DESKTOP */

@media(min-width:700px){

  .events-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .modal{
    align-items:center;
  }

  .modal-box{
    border-radius:22px;
  }

  .bottom-nav{
    bottom:0;
  }

  .buy-bar{
    bottom:65px;
  }
}

@media(max-width:390px){

  .events-grid{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .event-body{
    padding:10px;
  }

  .event-title{
    font-size:13px;
  }

  .event-date{
    font-size:11px;
  }

  .seat{
    width:23px;
    min-width:23px;
    height:23px;
  }
}
</style>
</head>

<body>

<!-- AUTH SCREEN -->

<section id="authScreen">

  <div class="auth-box">

    <img
      class="auth-logo"
      src="7953ADA7-1E8B-445A-BDF1-6A531ADE37A0.png"
      alt="Ticket Master">

    <div class="auth-title">Ticket Master</div>

    <div class="auth-subtitle">
      Independent event ticketing platform
    </div>

    <div class="auth-tabs">

      <button
        id="loginTab"
        class="auth-tab active"
        onclick="switchAuth('login')">
        Login
      </button>

      <button
        id="signupTab"
        class="auth-tab"
        onclick="switchAuth('signup')">
        Create account
      </button>

    </div>

    <div id="loginForm">

      <div class="form-group">
        <label class="form-label">Email</label>
        <input
          id="loginEmail"
          class="form-input"
          type="email"
          autocomplete="email"
          placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input
          id="loginPassword"
          class="form-input"
          type="password"
          autocomplete="current-password"
          placeholder="Your password">
      </div>

      <button
        class="primary-btn"
        onclick="login()">
        Login
      </button>

    </div>

    <div id="signupForm" class="hidden">

      <div class="form-group">
        <label class="form-label">Name</label>
        <input
          id="signupName"
          class="form-input"
          type="text"
          autocomplete="name"
          placeholder="Your name">
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input
          id="signupEmail"
          class="form-input"

function getUserDisplayName(user){

  return (
    user?.user_metadata?.full_name ||
    user?.user_metadata?.name ||
    user?.email?.split("@")[0] ||
    "User"
  );
}


function setCurrentUser(user){

  currentUser = user || null;

  const headerUser =
    document.getElementById("headerUser");

  if(headerUser && currentUser){

    const name =
      getUserDisplayName(currentUser);

    headerUser.textContent =
      name.charAt(0).toUpperCase();

  }

}


async function loadCurrentUser(){

  const result =
    await db.auth.getSession();

  setCurrentUser(
    result?.data?.session?.user || null
  );

}


function switchAuth(mode){

  const loginForm =
    document.getElementById("loginForm");

  const signupForm =
    document.getElementById("signupForm");

  const loginTab =
    document.getElementById("loginTab");

  const signupTab =
    document.getElementById("signupTab");

  if(mode === "login"){

    loginForm.classList.remove("hidden");
    signupForm.classList.add("hidden");

    loginTab.classList.add("active");
    signupTab.classList.remove("active");

  }else{

    loginForm.classList.add("hidden");
    signupForm.classList.remove("hidden");

    loginTab.classList.remove("active");
    signupTab.classList.add("active");

  }

}


async function signup(){

  const name =
    document.getElementById("signupName").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  if(!name){

    showToast("Enter your name");
    return;

  }

  if(!email){

    showToast("Enter your email");
    return;

  }

  if(password.length < 6){

    showToast("Password must be at least 6 characters");
    return;

  }

  const result =
    await db.auth.signUp({

      email,
      password,

      options:{
        data:{
          full_name:name,
          name:name
        },

        emailRedirectTo:
          "https://kodakebtcfx-ux.github.io/Ticketmaster/"
      }

    });


  if(result.error){

    console.error(result.error);

    showToast(
      result.error.message ||
      "Could not create account"
    );

    return;

  }

  if(result.data.session){

    setCurrentUser(result.data.user);

    await launchApp();

  }else{

    showToast(
      "Account created. Check your email to confirm your account."
    );

    switchAuth("login");

  }

}


async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    showToast("Enter your email and password");
    return;

  }

  const result =
    await db.auth.signInWithPassword({
      email,
      password
    });


  if(result.error){

    console.error(result.error);

    showToast(
      result.error.message ||
      "Login failed"
    );

    return;

  }

  setCurrentUser(result.data.user);

  await launchApp();

}


async function logout(){

  await db.auth.signOut();

  currentUser = null;
  favorites = [];
  selectedSeats = [];
  currentEvent = null;

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("authScreen")
    .classList.remove("hidden");

  switchAuth("login");

  showToast("Logged out");

}

/* =========================
   FAVORITES
========================= */

async function loadFavorites(){

  if(!currentUser){

    favorites=[];
    return;

  }

  const result =
    await db
      .from("favorites")
      .select("event_id")
      .eq("user_id",currentUser.id);


  if(result.error){

    console.error(
      "Favorites load error:",
      result.error
    );

    favorites=[];
    return;

  }

  favorites =
    (result.data || [])
      .map(row=>Number(row.event_id));

}


async function addFavorite(id){

  if(!currentUser){

    showToast("Please log in to save favorites");
    return false;

  }

  const result =
    await db
      .from("favorites")
      .insert({

        user_id:currentUser.id,
        event_id:String(id)

      });


  if(result.error){

    if(result.error.code !== "23505"){

      console.error(
        "Favorite insert error:",
        result.error
      );

      showToast("Could not save favorite");

      return false;

    }

  }

  return true;

}


async function removeFavorite(id){

  if(!currentUser)
    return false;

  const result =
    await db
      .from("favorites")
      .delete()
      .eq("user_id",currentUser.id)
      .eq("event_id",String(id));


  if(result.error){

    console.error(
      "Favorite delete error:",
      result.error
    );

    showToast("Could not remove favorite");

    return false;

  }

  return true;

}


async function toggleFavorite(id){

  const exists =
    favorites.includes(Number(id));


  if(exists){

    const ok =
      await removeFavorite(id);

    if(ok){

      favorites =
        favorites.filter(
          x=>Number(x)!==Number(id)
        );

      refreshCurrentPage();

    }

  }else{

    const ok =
      await addFavorite(id);

    if(ok){

      favorites.push(Number(id));

      refreshCurrentPage();

    }

  }

}

async function loadOrders(){

      .order("created_at",{ascending:false});


  if(result.error){

    console.error(
      "Orders load error:",

    );

    return;

  }

  orders =
    (result.data || []).map(row=>({

      id:row.id,
      userId:row.user_id,
      eventId:row.event_id,
      event:row.event_name,
      date:row.event_date,
      venue:row.venue,
      tickets:row.quantity,
      total:Number(row.total || 0),
      status:
        row.status === "confirmed"
          ? "Confirmed"

      created:
        row.created_at

          : ""

    }));

}

    .innerHTML = `

function searchEvents(value){

  const term =
    String(value || "")
      .trim()
      .toLowerCase();


  if(!term){

    renderHome();
    return;

  }


  const results =
    events.filter(event=>
      event.title.toLowerCase().includes(term) ||
      event.artist.toLowerCase().includes(term) ||
      event.venue.toLowerCase().includes(term) ||
      event.city.toLowerCase().includes(term) ||
      event.category.toLowerCase().includes(term)
    );


  document
    .getElementById("main")
    .innerHTML = `

      <div class="container">

        <div class="page-title">
          Search results
        </div>

        <div style="color:#778191;font-size:13px;margin-bottom:15px">
          ${results.length} result${results.length===1?"":"s"}
          for “${escapeHtml(value)}”
        </div>

        ${
          results.length
            ? `<div class="events-grid">
                ${results.map(eventCard).join("")}
               </div>`
            : `
              <div class="empty">

                <div class="empty-icon">⌕</div>

                <h3>
                  Nothing found
                </h3>

                <p>
                  Try searching for another artist,
                  event or venue.
                </p>

              </div>
            `
        }

      </div>

    `;

}

function generateSeatMap(){

  const sections = [

    {
      name:"VIP",
      rows:2,
      seats:10,
      price:currentEvent.price + 90
    },

    {
      name:"PREMIUM",
      rows:3,
      seats:12,
      price:currentEvent.price + 45
    },

    {
      name:"STANDARD",
      rows:5,
      seats:14,
      price:currentEvent.price
    }

  ];


  let html = `
    <div class="stage">
      STAGE
    </div>
  `;


  sections.forEach(section=>{

    html += `

      <div class="seat-section">

        <div class="seat-section-title">

          <strong>
            ${section.name}
          </strong>

          <span>
            From $${section.price}
          </span>

        </div>

    `;


    for(let row=1;row<=section.rows;row++){

      html += `<div class="seat-row">`;


      for(let number=1;number<=section.seats;number++){

        const key =
          `${section.name}-${row}-${number}`;

        const sold =
          isSeatSold(
            currentEvent.id,
            section.name,
            row,
            number
          );


        const selected =
          selectedSeats.some(
            seat=>seat.key===key
          );


        const resaleSeat =
          !sold &&
          number===section.seats &&
          row===section.rows;


        let className="seat available";

        if(sold)
          className="seat sold";

        else if(selected)
          className="seat selected";

        else if(resaleSeat)
          className="seat resale";


        html += `

          <button
            class="${className}"
            ${sold ? "disabled":""}
            title="${section.name} Row ${row} Seat ${number}"
            onclick="selectSeat(
              '${section.name}',
              ${row},
              ${number},
              ${section.price},
              '${key}'
            )">

            ${number}

          </button>

        `;

      }


      html += `</div>`;

    }


    html += `</div>`;

  });


  html += `

    <div class="seat-legend">

      <div class="legend-item">
        <span class="legend-dot dot-available"></span>
        Available
      </div>

      <div class="legend-item">
        <span class="legend-dot dot-selected"></span>
        Selected
      </div>

      <div class="legend-item">
        <span class="legend-dot dot-sold"></span>
        Unavailable
      </div>

      <div class="legend-item">
        <span class="legend-dot dot-resale"></span>
        Resale
      </div>

    </div>

  `;


  return html;

}


function isSeatSold(eventId,section,row,number){

  /*
    Deterministic seat availability.
    This gives each event a repeatable seat map.
  */

  const value =
    Number(eventId)*17 +
    section.length*7 +
    row*11 +
    number*5;


  return value % 13 === 0 ||
         value % 17 === 0;

}


function selectSeat(
  section,
  row,
  number,
  price,
  key
){

  if(!currentEvent)
    return;


  const existing =
    selectedSeats.find(
      seat=>seat.key===key
    );


  if(existing){

    selectedSeats =
      selectedSeats.filter(
        seat=>seat.key!==key
      );

  }else{

    selectedSeats.push({

      key,
      section,
      row,
      number,
      price:Number(price)

    });

  }


  const seatMap =
    document.getElementById("seatMap");

  if(seatMap){

    seatMap.innerHTML =
      generateSeatMap();

  }


  updateBuyBar();

}


function updateBuyBar(){

  const bar =
    document.getElementById("buyBar");


  if(!selectedSeats.length){

    bar.classList.remove("show");

  const total =
    selectedSeats.reduce(

  document
    .getElementById("buyCount")

      `${selectedSeats.length} ticket${selectedSeats.length===1?"":"s"}`;


  document
    .getElementById("buyTotal")
    .textContent =
      `$${total.toFixed(2)}`;


  bar.classList.add("show");

}

function formatCardNumber(value){

  return String(value)
    .replace(/\D/g,"")
    .slice(0,16)
    .replace(/(.{4})/g,"$1 ")
    .trim();

}


function setupPaymentFormatting(){

  document.addEventListener(
    "input",
    event=>{

      if(event.target.id==="cardNumber"){

        event.target.value =
          formatCardNumber(
            event.target.value
          );

      }


      if(event.target.id==="expiry"){

        let value =
          event.target.value
            .replace(/\D/g,"")
            .slice(0,4);


        if(value.length>2){

          value =
            value.slice(0,2)+
            "/"+
            value.slice(2);

        }


        event.target.value=value;

      }

    }
  );

}


async function completePurchase(){

  if(!currentUser){

    showToast("Please log in before purchasing");
    return;

  }


  if(!currentEvent){

    showToast("Please select an event again");
    return;

  }


  if(!selectedSeats.length){

    showToast("Please select at least one seat");
    return;

  }


  const nameElement =
    document.getElementById("cardName");

  const cardElement =
    document.getElementById("cardNumber");

  const expiryElement =
    document.getElementById("expiry");

  const cvcElement =
    document.getElementById("cvc");


  const name =
    nameElement?.value.trim() || "";

  const card =
    cardElement?.value
      .replace(/\s/g,"") || "";

  const expiry =
    expiryElement?.value.trim() || "";

  const cvc =
    cvcElement?.value.trim() || "";


  if(!name){

    showToast("Enter the cardholder name");
    return;

  }


  if(!/^\d{13,19}$/.test(card)){

    showToast("Enter a valid card number");
    return;

  }


  if(!/^\d{2}\/\d{2}$/.test(expiry)){

    showToast("Enter expiry as MM/YY");
    return;

  }


  const expiryParts =
    expiry.split("/");


  const month =
    Number(expiryParts[0]);

  const year =
    Number(expiryParts[1]);


  if(month<1 || month>12){

    showToast("Enter a valid expiry date");
    return;

  }


  const now =
    new Date();

  const currentYear =
    now.getFullYear()%100;

  const currentMonth =
    now.getMonth()+1;


  if(
    year<currentYear ||
    (
      year===currentYear &&
      month<currentMonth
    )
  ){

    showToast("Card appears to be expired");
    return;

  }


  if(!/^\d{3,4}$/.test(cvc)){

    showToast("Enter a valid CVC");
    return;

  }


  const button =
    document.querySelector(
      "#modalContent .full-btn"
    );


  if(button){

    button.disabled=true;
    button.textContent="Saving order...";

  }


  const orderId =
    "TM-"+Date.now().toString().slice(-8);


  const total =
    selectedSeats.reduce(
      (sum,seat)=>
        sum+Number(seat.price),
      0
    );


  /*
    IMPORTANT:
    We intentionally DO NOT save card information.
    Only the order information goes to Supabase.
  */


  let orderResult;


  try{

    orderResult =
      await db
        .from("orders")
        .insert({

          user_id:currentUser.id,

          event_id:
            String(currentEvent.id),

          event_name:
            currentEvent.title,

          event_date:
            currentEvent.date,

          venue:
            currentEvent.venue,

          total:
            total,

          quantity:
            selectedSeats.length,

          status:
            "confirmed"

        });

  }catch(error){

    console.error(
      "Order insert exception:",
      error
    );


    if(button){

      button.disabled=false;
      button.textContent=
        "Complete demo purchase";

    }


    showToast(
      "Order error: "+
      (
        error?.message ||
        "Unknown error"
      )
    );


    return;

  }


  if(orderResult.error){

    console.error(
      "Order save error:",
      orderResult.error
    );


    if(button){

      button.disabled=false;
      button.textContent=
        "Complete demo purchase";

    }


    const errorMessage =
      orderResult.error.message ||
      orderResult.error.details ||
      orderResult.error.hint ||
      "Unknown Supabase error";


    showToast(
      "Order error: "+
      errorMessage
    );


    return;

  }


  const purchaseTimestamp =
    Date.now();


  const newTickets =
    selectedSeats.map(
      (seat,index)=>({

        id:
          "TKT-"+
          purchaseTimestamp
            .toString()
            .slice(-7)+
          "-"+
          (index+1),

        orderId:
          orderId,

        userId:
          currentUser.id,

        eventId:
          currentEvent.id,

        event:
          currentEvent.title,

        artist:
          currentEvent.artist,

        image:
          currentEvent.image,

        date:
          currentEvent.date,

        time:
          currentEvent.time,

        venue:
          currentEvent.venue,

        city:
          currentEvent.city,

        section:
          seat.section,

        row:
          seat.row,

        seat:
          seat.number,

        price:
          seat.price,

        status:
          "active",

        owner:
          getUserDisplayName(currentUser)

      })
    );


  tickets.push(
    ...newTickets
  );


  const localOrder = {

    id:
      orderId,

    userId:
      currentUser.id,

    eventId:
      currentEvent.id,

    event:
      currentEvent.title,

    image:
      currentEvent.image,

    date:
      currentEvent.date,

    time:
      currentEvent.time,

    venue:
      currentEvent.venue,

    city:
      currentEvent.city,

    tickets:
      newTickets.length,

    total:
      total,

    status:
      "Confirmed",

    created:
      new Date().toLocaleDateString()

  };


  orders.unshift(
    localOrder
  );


  saveData();


  if(cardElement)
    cardElement.value="";

  if(expiryElement)
    expiryElement.value="";

  if(cvcElement)
    cvcElement.value="";


  closeModal();


  selectedSeats=[];


  document
    .getElementById("buyBar")
    .classList.remove("show");


  showToast(
    "Purchase completed"
  );


  setTimeout(
    ()=>{
      showPage("tickets");
    },
    500
  );

}

/* =========================
   MODAL
========================= */

function openModal(title,content){

  document
    .getElementById("modalTitle")
    .textContent=title;

  document
    .getElementById("modalContent")
    .innerHTML=content;

  document
    .getElementById("modal")
    .classList.add("show");

}


function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("show");

}


document
  .getElementById("modal")
  .addEventListener(
    "click",
    event=>{

      if(event.target.id==="modal")
        closeModal();

    }
  );


/* =========================
   TOAST
========================= */

let toastTimer;


function showToast(message){

  const toast =
    document.getElementById("toast");


  toast.textContent =
    message;


  toast.classList.add("show");


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      ()=>{
        toast.classList.remove("show");
      },
      3200
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   APP LAUNCH
========================= */

async function launchApp(){

  if(!currentUser){

    document
      .getElementById("authScreen")
      .classList.remove("hidden");

    document
      .getElementById("app")
      .classList.add("hidden");

    return;

  }


  document
    .getElementById("authScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");


  await loadFavorites();

  await loadOrders();


  updateNav("home");

  renderHome();

}


async function init(){

  setupPaymentFormatting();

  await loadCurrentUser();

  if(currentUser){

    await launchApp();

  }else{

    document
      .getElementById("authScreen")
      .classList.remove("hidden");

    document
      .getElementById("app")
      .classList.add("hidden");

  }

}


init();

</script>
